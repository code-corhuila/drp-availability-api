name: ci

on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...
      - name: No Postgres container in this repo
        run: "! grep -E 'image: postgres' deploy/compose.yml Dockerfile"
