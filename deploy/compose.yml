# API process only (Anexo J). No Postgres container. Engine: drp-infra-postgres.

name: ${COMPOSE_PROJECT_NAME:-drp-dev}

services:
  availability-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drp-availability-api
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8086}
      SERVICE_NAME: ${SERVICE_NAME:-availability-service}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:8081/api/v1/auth/jwks}
    ports:
      - "${HTTP_PORT:-8086}:8086"
    networks:
      - pg

networks:
  pg:
    name: ${AVAILABILITY_API_NETWORK:-drp-dev_default}
    external: true
